services:
  bot:
    build: ./bot
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      - PH_REDIS_URL=redis://redis:6379
      - PH_DATA_DIR=/data
    volumes:
      - botdata:/data
    depends_on:
      - redis
  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      - bot
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data

volumes:
  botdata:
  redisdata:
