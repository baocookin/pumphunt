# Host ports are configurable: set BOT_PORT / WEB_PORT in .env if 8080 or 3000 are taken.
services:
  bot:
    build: ./bot
    ports:
      - "${BOT_PORT:-8080}:8080"
    env_file: .env
    environment:
      - PH_REDIS_URL=redis://redis:6379
      - PH_DATA_DIR=/data
    volumes:
      - botdata:/data
    depends_on:
      - redis
  web:
    build:
      context: ./web
      args:
        # The browser calls the API directly, so this must be the *host* port of `bot`.
        NEXT_PUBLIC_API_URL: http://localhost:${BOT_PORT:-8080}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - bot
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data

volumes:
  botdata:
  redisdata:
