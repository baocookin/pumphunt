# Host port is configurable: set PORT in .env if 8080 is taken.
services:
  app:
    build: .
    ports:
      - "${PORT:-8080}:8080"
    env_file: .env
    environment:
      - PH_REDIS_URL=redis://redis:6379
      - PH_DATA_DIR=/data
    volumes:
      - botdata:/data
    depends_on:
      - redis
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data

volumes:
  botdata:
  redisdata:
