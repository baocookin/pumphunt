# Build the single image, push to GHCR, then point the Magic Containers app at the new tag.
# Mirrors jamie-at-bunny/mc-template-fastapi-with-redis. Repository settings needed:
#   Variable APP_ID            — Magic Containers app id
#   Secret   BUNNYNET_API_KEY  — bunny.net API key
# and the GHCR package must be public (or registry credentials configured in Bunny).
name: Build and Deploy to Magic Containers

on:
  push:
    branches: [main]

jobs:
  build:
    name: Build and deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Docker login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest
      - name: Deploy to Magic Containers
        uses: BunnyWay/actions/container-update-image@main
        with:
          app_id: ${{ vars.APP_ID }}
          api_key: ${{ secrets.BUNNYNET_API_KEY }}
          container: pumphunt # name of the container inside the Magic Containers app
          image_tag: ${{ github.sha }}
