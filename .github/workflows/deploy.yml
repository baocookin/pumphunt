# Build the scorer's image (ray/Dockerfile), push to GHCR, then point the Magic Containers app at the
# new tag. The research recorder's image (root Dockerfile) is no longer deployed; its last build is
# ghcr.io/baocookin/pumphunt:f20df965c218dca3c672191abe123bdd5fc9fad5. Repository settings needed:
#   Variable APP_ID            — Magic Containers app id
#   Secret   BUNNYNET_API_KEY  — bunny.net API key
# and the GHCR package must be public (or registry credentials configured in Bunny).
name: Build and Deploy to Magic Containers

on:
  push:
    branches: [main]
  workflow_dispatch: # manual rebuild + redeploy from the Actions tab

jobs:
  build:
    name: Build and deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Docker login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ray/Dockerfile
          push: true
          build-args: |
            BUILD_SHA=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest
      - name: Deploy to Magic Containers
        uses: BunnyWay/actions/container-update-image@main
        with:
          app_id: ${{ vars.APP_ID }}
          api_key: ${{ secrets.BUNNYNET_API_KEY }}
          container: pumphunt # name of the container inside the Magic Containers app
          image_tag: ${{ github.sha }}
