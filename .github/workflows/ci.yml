name: CI

on:
  push:
  pull_request:

jobs:
  bot:
    runs-on: ubuntu-latest
    # production keeps its state in Redis: the store contract tests run against a real server
    services:
      redis:
        # Docker Hub's official image through AWS's public mirror: runners share IPs, and Docker
        # Hub's unauthenticated pull limit failed this job before any test ran (09/10/2026).
        image: public.ecr.aws/docker/library/redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      REDIS_TEST_URL: redis://localhost:6379/15
    defaults:
      run:
        working-directory: bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - run: ruff check . && ruff format --check .
      - run: pytest -q

  ray:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ray
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - run: ruff check . && ruff format --check .
      - run: pytest -q
